name: Monthly CFO One Pager

on:
  schedule:
    - cron: "15 3 1 * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate CFO one-pager
        run: |
          python -m src.cfo_agent.main \
            --company "${{ vars.COMPANY_NAME || 'Your Company' }}" \
            --input-dir data/finance_exports \
            --input-glob "*.csv" \
            --output-dir output

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: cfo-monthly-output
          path: |
            output/*.md
            output/*.pptx
            output/charts/*.png
